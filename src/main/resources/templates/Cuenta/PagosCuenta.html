<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>Pagos de Cuenta</title>
</head>

<body>
<div layout:fragment="contenidopaginas">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h1 class="mb-0">Pagos de Cuenta #<span th:text="${cuenta.idcuenta}"></span></h1>
            <small class="text-muted">Gestiona abonos y valida saldo pendiente</small>
        </div>
        <a th:href="${origen == 'pedidos'} ? @{/pedidos} : @{/cuentas}" class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left"></i> Volver
        </a>
    </div>

    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-3 mb-3">
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small class="text-muted d-block">Total cuenta</small>
                    <h4 class="mb-0" th:text="${#numbers.formatDecimal(cuenta.total,1,2)}"></h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small class="text-muted d-block">Total pagado</small>
                    <h4 class="mb-0 text-success" th:text="${#numbers.formatDecimal(totalPagado,1,2)}"></h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small class="text-muted d-block">Saldo pendiente</small>
                    <h4 class="mb-0 text-warning" th:text="${#numbers.formatDecimal(saldoPendiente,1,2)}"></h4>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card">
                <div class="card-body">
                    <small class="text-muted d-block">Estado</small>
                    <span th:if="${cuenta.estado == 'ABIERTA'}" class="badge bg-warning text-dark">Abierta</span>
                    <span th:if="${cuenta.estado == 'PAGADA'}" class="badge bg-success">Pagada</span>
                    <span th:if="${cuenta.estado == 'ANULADA'}" class="badge bg-secondary">Anulada</span>
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-3" th:if="${cuenta.estado == 'ABIERTA'}">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-plus-circle"></i> Registrar pago</h5>
        </div>
        <div class="card-body">
            <form th:action="@{'/cuentas/' + ${cuenta.idcuenta} + '/pagos'}" method="post" class="row g-2 align-items-end" id="formPagoCuenta">
                <input type="hidden" name="origen" th:value="${origen}">
                <div class="col-md-3">
                    <label class="form-label">Monto a cobrar</label>
                    <input type="number" step="0.01" min="0.01" name="monto" id="montoPago" class="form-control" required
                           th:value="${#numbers.formatDecimal(saldoPendiente,1,2)}">
                    <small class="text-muted">Saldo pendiente: $<span th:text="${#numbers.formatDecimal(saldoPendiente,1,2)}"></span></small>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Metodo</label>
                    <select name="metodo" id="metodoPago" class="form-select" required>
                        <option value="EFECTIVO">Efectivo</option>
                        <option value="TRANSFERENCIA">Transferencia</option>
                    </select>
                </div>
                <div class="col-md-2" id="bloqueRecibido">
                    <label class="form-label">Valor recibido</label>
                    <input type="number" step="0.01" min="0.00" name="montoRecibido" id="montoRecibido" class="form-control"
                           placeholder="Ej: 10.00">
                </div>
                <div class="col-md-2" id="bloqueCambio">
                    <label class="form-label">Cambio</label>
                    <input type="text" id="cambioCalculado" class="form-control bg-light" value="0.00" readonly>
                </div>
                <div class="col-md-2 d-none" id="bloqueCanalTransferencia">
                    <label class="form-label">Canal</label>
                    <select name="canalTransferencia" id="canalTransferencia" class="form-select">
                        <option value="AHORITA">Ahorita - Banco de Loja</option>
                        <option value="DE_UNA">De Una - Banco Pichincha</option>
                    </select>
                </div>
                <div class="col-md-3 d-none" id="bloqueNroOperacion">
                    <label class="form-label">Nro. operacion</label>
                    <input type="text" name="nroOperacion" id="nroOperacion" class="form-control" maxlength="120" placeholder="Opcional">
                </div>
                <input type="hidden" name="referencia" value="">
                <div class="col-md-1 text-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-cash"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h5 class="mb-0"><i class="bi bi-list-check"></i> Historial de pagos</h5>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-striped table-hover mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Fecha</th>
                        <th>Metodo</th>
                        <th>Referencia</th>
                        <th>Usuario</th>
                        <th>Monto</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="p : ${pagos}">
                        <td th:text="${p.idpago}"></td>
                        <td th:text="${p.fecha != null} ? ${#temporals.format(p.fecha, 'dd/MM/yyyy HH:mm')} : '-'"></td>
                        <td th:text="${p.metodo}"></td>
                        <td th:text="${p.referencia != null && !p.referencia.isBlank()} ? ${p.referencia} : '-'"></td>
                        <td th:text="${p.usuario}"></td>
                        <td th:text="${#numbers.formatDecimal(p.monto,1,2)}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(pagos)}">
                        <td colspan="6" class="text-center text-muted py-3">Sin pagos registrados</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
<script th:inline="javascript">
    (function () {
        const saldoPendiente = parseFloat(/*[[${saldoPendiente}]]*/ 0);
        const form = document.getElementById('formPagoCuenta');
        if (!form) return;

        const metodo = document.getElementById('metodoPago');
        const monto = document.getElementById('montoPago');
        const montoRecibido = document.getElementById('montoRecibido');
        const cambio = document.getElementById('cambioCalculado');
        const bloqueRecibido = document.getElementById('bloqueRecibido');
        const bloqueCambio = document.getElementById('bloqueCambio');
        const bloqueCanal = document.getElementById('bloqueCanalTransferencia');
        const bloqueOperacion = document.getElementById('bloqueNroOperacion');
        const canal = document.getElementById('canalTransferencia');

        function to2(v) {
            return Number.isFinite(v) ? v.toFixed(2) : '0.00';
        }

        function recalcularCambio() {
            const m = parseFloat(monto.value || '0');
            const r = parseFloat(montoRecibido.value || '0');
            const c = r - m;
            cambio.value = to2(c > 0 ? c : 0);
        }

        function actualizarMetodo() {
            const esEfectivo = metodo.value === 'EFECTIVO';
            bloqueRecibido.classList.toggle('d-none', !esEfectivo);
            bloqueCambio.classList.toggle('d-none', !esEfectivo);
            bloqueCanal.classList.toggle('d-none', esEfectivo);
            bloqueOperacion.classList.toggle('d-none', esEfectivo);
            montoRecibido.required = esEfectivo;
            canal.required = !esEfectivo;
                if (!esEfectivo) {
                    montoRecibido.value = '';
                    cambio.value = '0.00';
                    if (!canal.value) {
                        canal.value = 'AHORITA';
                    }
                }
            }

        actualizarMetodo();
        recalcularCambio();
        metodo.addEventListener('change', actualizarMetodo);
        monto.addEventListener('input', recalcularCambio);
        montoRecibido.addEventListener('input', recalcularCambio);

        form.addEventListener('submit', function (e) {
            const m = parseFloat(monto.value || '0');
            if (!(m > 0)) {
                e.preventDefault();
                alert('El monto debe ser mayor a 0.');
                return;
            }
            if (m > saldoPendiente) {
                e.preventDefault();
                alert('El monto no puede exceder el saldo pendiente.');
                return;
            }

            if (metodo.value === 'EFECTIVO') {
                const r = parseFloat(montoRecibido.value || '0');
                if (r < m) {
                    e.preventDefault();
                    alert('El valor recibido no puede ser menor al monto a cobrar.');
                }
                return;
            }

            if (!canal.value) {
                e.preventDefault();
                alert('Seleccione la plataforma de transferencia.');
            }
        });
    })();
</script>
</body>
</html>
