spring.application.name=pisip
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/PisipApi2}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:.r4e3w2q1}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# baseline-on-migrate=true permite que BD existentes sean marcadas como "base"
# sin intentar ejecutar V1 (V1 solo se aplica en BD nuevas vacias)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8085}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never


dropbox.app-key=${DROPBOX_APP_KEY:um7cvrc45d8je7p}
dropbox.app-secret=${DROPBOX_APP_SECRET:abcp4nvw24ws8nd}
dropbox.refresh-token=${DROPBOX_REFRESH_TOKEN:CdxO3uCrb-EAAAAAAAAAAZuPiLe5pfFQgLsdsCUUfDP7vNpQ5-vpsfeLbmFThSv4}
dropbox.folder-root=${DROPBOX_FOLDER_ROOT:/LaChoza/Comprobantes}

spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=8MB
management.endpoint.health.probes.enabled=true

info.app.name=Pisip API
info.app.version=0.0.1-SNAPSHOT

spring.profiles.default=dev

server.error.include-message=never
server.error.include-binding-errors=never

logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestResponseBodyMethodProcessor=INFO
logging.level.org.springframework.web.servlet.mvc.method.annotation.HttpEntityMethodProcessor=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO
