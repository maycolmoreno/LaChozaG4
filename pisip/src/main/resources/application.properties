spring.application.name=pisip
server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/PisipApi2}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:.r4e3w2q1}

spring.jpa.defer-datasource-initialization=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret=${JWT_SECRET:change-this-secret-with-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8085}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.disable-swagger-default-url=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

info.app.name=Pisip API
info.app.version=0.0.1-SNAPSHOT

spring.profiles.default=dev
