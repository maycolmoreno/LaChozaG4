<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>Usuario - Formulario</title>
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="form-modern-card">
            <div class="form-modern-header">
                <div class="form-modern-header-icon"><i class="bi bi-people-fill"></i></div>
                <div class="form-modern-header-text">
                    <h4 th:text="${usuario.idusuario == null} ? 'Nuevo Usuario' : 'Editar Usuario'"></h4>
                    <p>Administración de accesos al sistema</p>
                </div>
            </div>
            <form th:action="@{/usuario/guardar}" th:object="${usuario}" method="post" class="needs-validation" novalidate>
                <input type="hidden" th:field="*{idusuario}" />
                <div class="form-modern-body">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" id="username"
                                   th:field="*{username}" required maxlength="100" placeholder="usuario123" />
                            <div class="invalid-feedback">El username es obligatorio.</div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="password" class="form-label">Contraseña</label>
                            <div class="input-group">
                                <input type="password" class="form-control" id="password"
                                       th:field="*{password}"
                                       th:required="${usuario.idusuario == null}" maxlength="255"
                                       th:placeholder="${usuario.idusuario == null} ? '••••••••' : 'Dejar vacío para no cambiar'" />
                                <button class="btn btn-outline-secondary" type="button" onclick="togglePass(this)">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <small class="text-muted" th:if="${usuario.idusuario != null}">
                                Dejar vacío para mantener la contraseña actual
                            </small>
                            <div class="invalid-feedback" th:if="${usuario.idusuario == null}">La contraseña es obligatoria.</div>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="nombreCompleto" class="form-label">Nombre Completo</label>
                        <input type="text" class="form-control" id="nombreCompleto"
                               th:field="*{nombreCompleto}" required maxlength="255" placeholder="Juan Pérez" />
                        <div class="invalid-feedback">El nombre completo es obligatorio.</div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="rol" class="form-label">Rol</label>
                            <select class="form-select" id="rol" th:field="*{rol}" required>
                                <option value="">Seleccione un rol</option>
                                <option value="ADMIN">Administrador</option>
                                <option value="CAMARERO">Camarero</option>
                                <option value="CAJERO">Cajero</option>
                                <option value="COCINA">Cocina</option>
                            </select>
                            <div class="invalid-feedback">Debe seleccionar un rol.</div>
                        </div>
                        <div class="col-md-6 mb-3 d-flex align-items-end">
                            <div class="form-check form-switch">
                                <input type="checkbox" class="form-check-input" id="estado" th:field="*{estado}" />
                                <label class="form-check-label" for="estado">Activo</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="form-modern-footer">
                    <a th:href="@{/usuario}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-save me-1"></i> Guardar
                    </button>
                </div>
            </form>
        </div>
        <script>
        function togglePass(btn) {
            const input = btn.parentElement.querySelector('input');
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text'; icon.className = 'bi bi-eye-slash';
            } else {
                input.type = 'password'; icon.className = 'bi bi-eye';
            }
        }
        </script>
    </div>
</body>
</html>
