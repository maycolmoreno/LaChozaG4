<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>Detalle de Pedido</title>
    <link th:href="@{/css/ticket-print.css}" rel="stylesheet" />
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <!-- Contenedor imprimible -->
        <div class="ticket-container">

            <!-- Header del pedido -->
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
                <div class="d-flex align-items-center gap-3">
                    <div style="width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;">
                        <i class="bi bi-receipt-cutoff" style="font-size:1.4rem;color:var(--naranja-choza)"></i>
                    </div>
                    <div>
                        <h3 class="mb-0 fw-bold">Pedido #<span th:text="${pedido.idpedido}"></span></h3>
                        <small class="text-muted" th:text="${#temporals.format(pedido.fecha, 'dd/MM/yyyy HH:mm')}"></small>
                    </div>
                </div>
                <div class="no-print d-flex gap-2">
                    <button onclick="imprimirTicket()" class="btn btn-print">
                        <i class="bi bi-printer me-1"></i> Imprimir
                    </button>
                    <a th:href="@{/pedidos}" class="btn btn-outline-secondary">
                        <i class="bi bi-arrow-left me-1"></i> Volver
                    </a>
                </div>
            </div>

            <!-- Info cards -->
            <div class="row g-3 mb-4">
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div style="width:42px;height:42px;border-radius:10px;background:#e8f5e9;display:flex;align-items:center;justify-content:center;">
                                <i class="bi bi-grid-3x3-gap-fill text-success"></i>
                            </div>
                            <div>
                                <small class="text-muted d-block" style="font-size:.75rem">Mesa</small>
                                <strong th:text="${pedido.mesa != null} ? 'Mesa ' + ${pedido.mesa.numero} : 'Sin mesa'"></strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div style="width:42px;height:42px;border-radius:10px;background:#e3f2fd;display:flex;align-items:center;justify-content:center;">
                                <i class="bi bi-person-badge-fill text-primary"></i>
                            </div>
                            <div>
                                <small class="text-muted d-block" style="font-size:.75rem">Cliente</small>
                                <strong th:text="${pedido.cliente != null} ? ${pedido.cliente.nombre} : 'Consumidor final'"></strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div style="width:42px;height:42px;border-radius:10px;background:#fff3e0;display:flex;align-items:center;justify-content:center;">
                                <i class="bi bi-person-fill" style="color:var(--naranja-choza)"></i>
                            </div>
                            <div>
                                <small class="text-muted d-block" style="font-size:.75rem">Atendido por</small>
                                <strong th:text="${pedido.usuario != null} ? ${pedido.usuario.nombreCompleto} : '-'"></strong>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-6 col-md-3">
                    <div class="card border-0 shadow-sm h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div style="width:42px;height:42px;border-radius:10px;background:#fce4ec;display:flex;align-items:center;justify-content:center;">
                                <i class="bi bi-chat-text-fill text-danger"></i>
                            </div>
                            <div>
                                <small class="text-muted d-block" style="font-size:.75rem">Observaciones</small>
                                <strong th:text="${pedido.observaciones} ?: 'Sin observaciones'" style="font-size:.88rem"></strong>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Estado del pedido - Timeline -->
            <div class="card border-0 shadow-sm mb-4 no-print">
                <div class="card-body py-3 px-4">
                    <div class="d-flex align-items-center justify-content-between flex-wrap gap-2" id="pedido-timeline">
                        <div class="text-center flex-fill" th:each="paso : ${ {
                            new String[]{'PENDIENTE','bi-clock-fill','Pendiente'},
                            new String[]{'EN_COCINA','bi-fire','En Cocina'},
                            new String[]{'LISTO_PARA_ENTREGA','bi-check2-circle','Listo'},
                            new String[]{'COMPLETADO','bi-check-circle-fill','Completado'}
                        } }">
                            <div th:with="estadoActual=${pedido.estado}"
                                 th:classappend="${paso[0] == estadoActual} ? 'timeline-step-active' : 'timeline-step-inactive'"
                                 class="d-flex flex-column align-items-center">
                                <div style="width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1rem;margin-bottom:4px;"
                                     th:styleappend="${paso[0] == estadoActual} ? 'background:var(--naranja-choza);color:#fff' : 'background:#e9ecef;color:#aaa'">
                                    <i th:class="${paso[1]}"></i>
                                </div>
                                <small th:text="${paso[2]}" th:styleappend="${paso[0] == estadoActual} ? 'color:var(--naranja-choza);font-weight:700' : 'color:#aaa'"
                                       style="font-size:.75rem"></small>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabla de productos -->
            <div class="card border-0 shadow-sm">
                <div class="card-header border-0 bg-white d-flex align-items-center gap-2 py-3">
                    <i class="bi bi-bag-fill" style="color:var(--naranja-choza)"></i>
                    <h5 class="mb-0 fw-bold">Productos del Pedido</h5>
                    <span class="badge bg-light text-dark ms-auto"
                          th:text="${pedido.detalle != null} ? ${#lists.size(pedido.detalle)} + ' items' : '0 items'"></span>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-hover mb-0 align-middle">
                            <thead style="background:#f8f9fa">
                                <tr>
                                    <th class="ps-4" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Producto</th>
                                    <th class="text-center" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Cant.</th>
                                    <th class="text-end" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">P.Unit</th>
                                    <th class="text-end pe-4" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Subtotal</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="det : ${pedido.detalle}">
                                    <td class="ps-4 fw-semibold" th:text="${det.producto != null} ? ${det.producto.nombre} : 'Producto'"></td>
                                    <td class="text-center">
                                        <span class="badge bg-light text-dark rounded-pill px-3" th:text="${det.cantidad}"></span>
                                    </td>
                                    <td class="text-end text-muted" th:text="'$' + ${#numbers.formatDecimal(det.precioUnitario, 1, 2)}"></td>
                                    <td class="text-end pe-4 fw-bold" th:text="'$' + ${#numbers.formatDecimal(det.subtotal, 1, 2)}"></td>
                                </tr>
                                <tr th:if="${pedido.detalle == null || #lists.isEmpty(pedido.detalle)}">
                                    <td colspan="4" class="text-center text-muted py-4">No hay productos en este pedido</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white border-top d-flex justify-content-end align-items-center gap-3 py-3 pe-4">
                    <span class="text-muted fw-semibold" style="font-size:.95rem">TOTAL</span>
                    <span class="fw-bold" style="font-size:1.5rem;color:var(--naranja-choza)"
                          th:text="'$' + ${#numbers.formatDecimal(pedido.total, 1, 2)}"></span>
                </div>
            </div>

            <!-- Pie del ticket (solo visible al imprimir) -->
            <div class="text-center mt-3" style="display: none;" id="ticketFooter">
                <p>¡Gracias por su preferencia!</p>
                <p>La Choza - Restaurant</p>
            </div>
        </div>

        <script>
            function imprimirTicket() {
                document.getElementById('ticketFooter').style.display = 'block';
                window.print();
                setTimeout(function() {
                    document.getElementById('ticketFooter').style.display = 'none';
                }, 1000);
            }
        </script>
    </div>
</body>
</html>
