<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>Mesas</title>
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <!-- Alertas de mensajes flash -->
        <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
            <i class="bi bi-check-circle-fill me-2"></i>
            <span th:text="${mensajeExito}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            <span th:text="${mensajeError}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Lista de Mesas</h1>
            <a th:href="@{/mesa/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-circle"></i> Nueva Mesa
            </a>
        </div>

        <!-- Filtros de mesas -->
        <div class="row mb-4">
            <div class="col-12">
                <div class="btn-group" role="group" aria-label="Filtros de mesas">
                    <a th:href="@{/mesa}" 
                       th:class="${filtro == 'todas'} ? 'btn btn-primary' : 'btn btn-outline-primary'">
                        <i class="bi bi-grid"></i> Todas 
                        <span class="badge bg-light text-dark" th:text="${#lists.size(mesasDisponibles) + #lists.size(mesasOcupadas)}"></span>
                    </a>
                    <a th:href="@{/mesa/disponibles}" 
                       th:class="${filtro == 'disponibles'} ? 'btn btn-success' : 'btn btn-outline-success'">
                        <i class="bi bi-check-circle"></i> Disponibles 
                        <span class="badge bg-light text-dark" th:text="${#lists.size(mesasDisponibles)}"></span>
                    </a>
                    <a th:href="@{/mesa/ocupadas}" 
                       th:class="${filtro == 'ocupadas'} ? 'btn btn-danger' : 'btn btn-outline-danger'">
                        <i class="bi bi-x-circle"></i> Ocupadas 
                        <span class="badge bg-light text-dark" th:text="${#lists.size(mesasOcupadas)}"></span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Mesas agrupadas por Comedor -->
        <div th:each="comedor : ${comedores}" class="card mb-4 shadow-sm">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-house-door-fill me-2"></i>
                    <span th:text="${comedor.nombre}">Comedor</span>
                </h5>
                <span class="badge bg-light text-dark"
                      th:text="${#lists.size(mesasPorComedor[comedor.idcomedor])} + ' mesa(s)'">
                </span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" data-paginate="10">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Número</th>
                                <th>Capacidad</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="mesa : ${mesasPorComedor[comedor.idcomedor]}">
                                <td th:text="${mesa.idmesa}"></td>
                                <td th:text="${mesa.numero}"></td>
                                <td th:text="${mesa.capacidad}"></td>
                                <td>
                                    <span th:if="${mesa.estado}" class="badge bg-success">Disponible</span>
                                    <span th:unless="${mesa.estado}" class="badge bg-danger">Ocupada</span>
                                </td>
                                <td>
                                    <a th:href="@{/mesa/editar/{id}(id=${mesa.idmesa})}" 
                                       class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <a th:href="@{/mesa/eliminar/{id}(id=${mesa.idmesa})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Está seguro de dar de baja esta mesa?')">
                                        <i class="bi bi-trash"></i> Dar de baja
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Mesas sin comedor asignado -->
        <div class="card mb-4 shadow-sm" th:if="${!#lists.isEmpty(mesasSinComedor)}">
            <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">
                    <i class="bi bi-question-circle-fill me-2"></i>
                    Sin Comedor Asignado
                </h5>
                <span class="badge bg-light text-dark"
                      th:text="${#lists.size(mesasSinComedor)} + ' mesa(s)'">
                </span>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover mb-0" data-paginate="10">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Número</th>
                                <th>Capacidad</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="mesa : ${mesasSinComedor}">
                                <td th:text="${mesa.idmesa}"></td>
                                <td th:text="${mesa.numero}"></td>
                                <td th:text="${mesa.capacidad}"></td>
                                <td>
                                    <span th:if="${mesa.estado}" class="badge bg-success">Disponible</span>
                                    <span th:unless="${mesa.estado}" class="badge bg-danger">Ocupada</span>
                                </td>
                                <td>
                                    <a th:href="@{/mesa/editar/{id}(id=${mesa.idmesa})}" 
                                       class="btn btn-warning btn-sm">
                                        <i class="bi bi-pencil"></i> Editar
                                    </a>
                                    <a th:href="@{/mesa/eliminar/{id}(id=${mesa.idmesa})}" 
                                       class="btn btn-danger btn-sm"
                                       onclick="return confirm('¿Está seguro de dar de baja esta mesa?')">
                                        <i class="bi bi-trash"></i> Dar de baja
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div th:if="${#lists.isEmpty(mesas)}" class="alert alert-info text-center">
            <i class="bi bi-info-circle me-2"></i> No hay mesas registradas
        </div>
    </div>
</body>
</html>
