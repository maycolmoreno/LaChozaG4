<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>Acceso Denegado</title>
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <div class="error-page">
            <div class="error-icon error-icon-danger">
                <i class="bi bi-shield-x"></i>
            </div>
            <h1 class="error-code">403</h1>
            <h2 class="error-title">Acceso Denegado</h2>
            <p class="error-message">
                No tienes permisos para acceder a esta p&aacute;gina.<br>
                Contacta al administrador si crees que esto es un error.
            </p>
            <div class="error-actions">
                <a th:href="@{/}" class="error-btn error-btn-primary">
                    <i class="bi bi-house-fill"></i> Ir al Inicio
                </a>
                <button type="button" class="error-btn error-btn-secondary" onclick="history.back()">
                    <i class="bi bi-arrow-left"></i> Volver atr&aacute;s
                </button>
            </div>
        </div>
    </div>
</body>
</html>
