<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>P&aacute;gina no encontrada</title>
</head>

<body>
    <div layout:fragment="contenidopaginas">
        <div class="error-page">
            <div class="error-icon error-icon-warning">
                <i class="bi bi-compass"></i>
            </div>
            <h1 class="error-code">404</h1>
            <h2 class="error-title">P&aacute;gina no encontrada</h2>
            <p class="error-message">
                La p&aacute;gina que buscas no existe o fue movida.<br>
                Verifica la URL o regresa al inicio.
            </p>
            <div class="error-actions">
                <a th:href="@{/}" class="error-btn error-btn-primary">
                    <i class="bi bi-house-fill"></i> Ir al Inicio
                </a>
                <button type="button" class="error-btn error-btn-secondary" onclick="history.back()">
                    <i class="bi bi-arrow-left"></i> Volver atr&aacute;s
                </button>
            </div>
        </div>
    </div>
</body>
</html>
