<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{Masterplantilla/Master}">

<head>
    <title>Cuentas abiertas</title>
</head>

<body>
<div layout:fragment="contenidopaginas">
    <!-- Alertas de mensajes flash -->
    <div th:if="${mensajeExito}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${mensajeExito}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${mensajeError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${mensajeError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <div class="d-flex align-items-center gap-3">
            <div style="width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#1a1a2e,#16213e);display:flex;align-items:center;justify-content:center;">
                <i class="bi bi-cash-stack" style="font-size:1.3rem;color:var(--naranja-choza)"></i>
            </div>
            <div>
                <h3 class="mb-0 fw-bold" th:text="${filtroEstado == 'ABIERTA'} ? 'Cuentas Pendientes' : 'Historial de Cuentas'">Cuentas Pendientes</h3>
                <small class="text-muted">
                    <span th:text="${#lists.size(cuentas)}"></span> cuenta(s) encontrada(s)
                </small>
            </div>
        </div>
    </div>

    <!-- Filtros -->
    <div class="card border-0 shadow-sm mb-3">
        <div class="card-body">
            <form th:action="@{/cuentas}" method="get" class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="font-size:.85rem">Desde</label>
                    <input type="date" name="fechaDesde" class="form-control" th:value="${fechaDesde}" style="border-radius:10px">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold" style="font-size:.85rem">Hasta</label>
                    <input type="date" name="fechaHasta" class="form-control" th:value="${fechaHasta}" style="border-radius:10px">
                </div>
                <div class="col-md-3">
                    <label class="form-label fw-semibold d-block" style="font-size:.85rem">Estado</label>
                    <div class="btn-group w-100" role="group" aria-label="Filtro estado cuentas">
                        <a th:href="@{/cuentas(fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}"
                           class="btn btn-outline-secondary btn-sm"
                           th:classappend="${filtroEstado} == 'TODAS' ? ' active' : ''">Todas</a>
                        <a th:href="@{/cuentas(estado='ABIERTA', fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}"
                           class="btn btn-outline-warning btn-sm"
                           th:classappend="${filtroEstado} == 'ABIERTA' ? ' active' : ''">Abiertas</a>
                        <a th:href="@{/cuentas(estado='PAGADA', fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}"
                           class="btn btn-outline-success btn-sm"
                           th:classappend="${filtroEstado} == 'PAGADA' ? ' active' : ''">Pagadas</a>
                        <a th:href="@{/cuentas(estado='ANULADA', fechaDesde=${fechaDesde}, fechaHasta=${fechaHasta})}"
                           class="btn btn-outline-secondary btn-sm"
                           th:classappend="${filtroEstado} == 'ANULADA' ? ' active' : ''">Anuladas</a>
                    </div>
                </div>
                <div class="col-md-3 text-end mt-2 mt-md-0">
                    <button type="submit" class="btn btn-outline-primary btn-sm">
                        <i class="bi bi-search"></i> Aplicar filtros
                    </button>
                    <a th:href="@{/cuentas}" class="btn btn-outline-secondary btn-sm">Limpiar</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle" data-paginate="10">
                    <thead style="background:#f8f9fa">
                    <tr>
                        <th class="ps-3" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">ID</th>
                        <th style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Mesa</th>
                        <th style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Cliente</th>
                        <th style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Fecha apertura</th>
                        <th class="text-end" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Total</th>
                        <th class="text-center" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Estado</th>
                        <th class="text-end pe-3" style="font-size:.8rem;text-transform:uppercase;color:#888;font-weight:600">Acciones</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${cuentas}">
                        <td class="ps-3 fw-semibold" th:text="${c.idcuenta}"></td>
                        <td>
                            <span th:if="${c.mesa != null}" class="d-flex align-items-center gap-1">
                                <i class="bi bi-grid-3x3-gap-fill text-muted" style="font-size:.75rem"></i>
                                Mesa <span th:text="${c.mesa.numero}"></span>
                            </span>
                            <span th:if="${c.mesa == null}" class="text-muted">-</span>
                        </td>
                        <td th:text="${c.cliente != null} ? ${c.cliente.nombre} : '-' "></td>
                        <td th:text="${c.fechaApertura != null} ? ${#temporals.format(c.fechaApertura, 'dd/MM/yyyy HH:mm')} : '-' "></td>
                        <td class="text-end fw-bold" th:text="'$' + ${#numbers.formatDecimal(c.total, 1, 2)}"></td>
                        <td class="text-center">
                            <span th:if="${c.estado == 'ABIERTA'}" class="badge bg-warning text-dark">Abierta</span>
                            <span th:if="${c.estado == 'PAGADA'}" class="badge bg-success">Pagada</span>
                            <span th:if="${c.estado == 'ANULADA'}" class="badge bg-secondary">Anulada</span>
                        </td>
                        <td class="text-end pe-3">
                            <div class="d-flex gap-1 justify-content-end">
                                <a th:href="@{'/cuentas/' + ${c.idcuenta} + '/pagos'}" class="btn btn-sm btn-outline-primary" title="Ver pagos">
                                    <i class="bi bi-wallet2"></i>
                                </a>
                                <a th:if="${c.estado == 'ABIERTA'}"
                                   th:href="@{'/cuentas/' + ${c.idcuenta} + '/pagos'}"
                                   class="btn btn-success btn-sm" title="Cobrar">
                                    <i class="bi bi-cash"></i> Cobrar
                                </a>
                                <form th:action="@{'/cuentas/anular/' + ${c.idcuenta}}" method="post" style="display:inline" th:if="${c.estado == 'ABIERTA'}">                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />                                    <button type="submit" class="btn btn-outline-danger btn-sm" onclick="return confirm('¿Anular esta cuenta?');" title="Anular">
                                        <i class="bi bi-x-circle"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cuentas)}">
                        <td colspan="7" class="text-center text-muted py-4">
                            <i class="bi bi-inbox" style="font-size:2rem;display:block;margin-bottom:8px;opacity:.4"></i>
                            No hay cuentas para los criterios seleccionados
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
</body>
</html>
