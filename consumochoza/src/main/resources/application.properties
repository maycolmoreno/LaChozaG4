spring.application.name=consumochoza
server.port=${PORT:${SERVER_PORT:8081}}
api.base-url=${API_BASE_URL:http://localhost:8081/api}



jwt.secret=${JWT_SECRET:change-this-secret-with-at-least-32-characters}
jwt.expiration=${JWT_EXPIRATION:86400000}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8085}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

info.app.name=Consumo Choza
info.app.version=0.0.1-SNAPSHOT

spring.profiles.default=dev
